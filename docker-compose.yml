version: '3.8'

services:
  package-tracker:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/package_tracker.db
    volumes:
      - ./data:/app/data  # Persist database
      - ./.env:/app/.env  # Mount environment file
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

