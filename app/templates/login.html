{% extends "base.html" %}

{% block title %}Login - Gmail Package Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body text-center">
                <div class="mb-4">
                    <i class="fas fa-box fa-3x text-primary"></i>
                    <h2 class="mt-3">Package Tracker</h2>
                    <p class="text-muted">Track your packages from Gmail with AI</p>
                </div>
                
                <a href="/auth/google" class="btn btn-danger btn-lg w-100">
                    <i class="fab fa-google me-2"></i>
                    Sign in with Google
                </a>
                
                <div class="mt-4">
                    <small class="text-muted">
                        <i class="fas fa-shield-alt"></i>
                        Secure OAuth2 authentication
                    </small>
                </div>
            </div>
        </div>
        
        <div class="mt-4 text-center">
            <h5>How it works:</h5>
            <div class="row mt-3">
                <div class="col-4">
                    <i class="fas fa-envelope fa-2x text-primary"></i>
                    <p class="small mt-2">Connect Gmail</p>
                </div>
                <div class="col-4">
                    <i class="fas fa-robot fa-2x text-success"></i>
                    <p class="small mt-2">AI Analysis</p>
                </div>
                <div class="col-4">
                    <i class="fas fa-truck fa-2x text-info"></i>
                    <p class="small mt-2">Track Packages</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
